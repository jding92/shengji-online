<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!--
    Game emblem: the Joker mask riding a red starburst, with a rotated
    vermilion seal chop (升) as the maker's mark. Square, so it drops into
    every brand tile from 39px to 92px.
  -->
  <defs>
    <linearGradient id="seal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4d63"/>
      <stop offset="1" stop-color="#8c0a20"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="14" fill="#0c0a0f"/>
  <g fill="#e51636">
    <polygon points="60 58 52 -30 68 -30" opacity=".55"/>
    <polygon points="60 58 52 -30 68 -30" opacity=".25" transform="rotate(30 60 58)"/>
    <polygon points="60 58 52 -30 68 -30" opacity=".55" transform="rotate(60 60 58)"/>
    <polygon points="60 58 52 -30 68 -30" opacity=".25" transform="rotate(90 60 58)"/>
    <polygon points="60 58 52 -30 68 -30" opacity=".55" transform="rotate(120 60 58)"/>
    <polygon points="60 58 52 -30 68 -30" opacity=".25" transform="rotate(150 60 58)"/>
    <polygon points="60 58 52 -30 68 -30" opacity=".55" transform="rotate(180 60 58)"/>
    <polygon points="60 58 52 -30 68 -30" opacity=".25" transform="rotate(210 60 58)"/>
    <polygon points="60 58 52 -30 68 -30" opacity=".55" transform="rotate(240 60 58)"/>
    <polygon points="60 58 52 -30 68 -30" opacity=".25" transform="rotate(270 60 58)"/>
    <polygon points="60 58 52 -30 68 -30" opacity=".55" transform="rotate(300 60 58)"/>
    <polygon points="60 58 52 -30 68 -30" opacity=".25" transform="rotate(330 60 58)"/>
  </g>
  <circle cx="60" cy="58" r="35" fill="#0c0a0f"/>
  <circle cx="60" cy="58" r="35" fill="none" stroke="#e51636" stroke-width="1.5" opacity=".6"/>
  <!-- Halftone drift in the top-left quiet corner. -->
  <g fill="#ffffff" opacity=".12">
    <circle cx="14" cy="16" r="2"/><circle cx="24" cy="12" r="1.6"/><circle cx="34" cy="9" r="1.2"/>
    <circle cx="17" cy="27" r="1.6"/><circle cx="27" cy="23" r="1.2"/><circle cx="37" cy="19" r=".9"/>
  </g>
  <!-- The winged domino mask. -->
  <path fill="#f7f5f0" fill-rule="evenodd" d="M60 38C46 36 30 42 16 58C28 52 36 54 42 60C48 66 56 70 60 68C64 70 72 66 78 60C84 54 92 52 104 58C90 42 74 36 60 38ZM33 52C39 47 49 48 53 53C49 58 39 58 33 52ZM87 52C81 47 71 48 67 53C71 58 81 58 87 52Z"/>
  <!-- Gold spark at the mask's brow. -->
  <path fill="#ffb63d" d="M60 20l2.2 6 6 2.2-6 2.2-2.2 6-2.2-6-6-2.2 6-2.2z"/>
  <!-- Vermilion seal chop, stamped crooked: 升 in white on red. -->
  <g transform="rotate(-8 88 92)">
    <rect x="70" y="74" width="36" height="36" rx="5" fill="url(#seal)"/>
    <rect x="73" y="77" width="30" height="30" rx="3" fill="none" stroke="#ffffff" stroke-width="2" opacity=".85"/>
    <text x="88" y="101" font-family="Kaiti SC, STKaiti, serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">升</text>
  </g>
</svg>
