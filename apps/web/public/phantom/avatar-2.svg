<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Seat 2 — the Phantom: half-ink trickster lianpu, split face. -->
  <rect width="100" height="100" fill="#16131b"/>
  <g fill="#e51636" opacity=".3">
    <polygon points="50 52 44 -20 56 -20" transform="rotate(36 50 52)"/>
    <polygon points="50 52 44 -20 56 -20" transform="rotate(108 50 52)"/>
    <polygon points="50 52 44 -20 56 -20" transform="rotate(180 50 52)"/>
    <polygon points="50 52 44 -20 56 -20" transform="rotate(252 50 52)"/>
    <polygon points="50 52 44 -20 56 -20" transform="rotate(324 50 52)"/>
  </g>
  <path fill="#f7f5f0" d="M50 10C70 10 80 25 78 47C76 68 66 87 50 91C34 87 24 68 22 47C20 25 30 10 50 10Z"/>
  <!-- Ink half of the face, cut on a jagged diagonal. -->
  <path fill="#1d1826" d="M50 10C70 10 80 25 78 47C76 68 66 87 50 91L52 66L46 48L54 30L48 10Z"/>
  <!-- Red eye slit on the dark side. -->
  <polygon fill="#e51636" points="58,47 72,45 70,52 59,53"/>
  <!-- Black eye on the light side. -->
  <polygon fill="#1d1826" points="28,47 42,45 40,52 29,53"/>
  <!-- Sly grin curling up the light cheek. -->
  <path fill="#e51636" d="M30 70C36 76 44 78 50 76L49 71C44 72 37 70 33 66Z"/>
  <!-- Gold stud on the dark brow. -->
  <circle cx="64" cy="32" r="3.4" fill="#ffb63d"/>
</svg>
