  <g fill="#3f8cff" opacity=".26">
    <polygon points="50 52 44 -20 56 -20"/>
    <polygon points="50 52 44 -20 56 -20" transform="rotate(72 50 52)"/>
    <polygon points="50 52 44 -20 56 -20" transform="rotate(144 50 52)"/>
    <polygon points="50 52 44 -20 56 -20" transform="rotate(216 50 52)"/>
    <polygon points="50 52 44 -20 56 -20" transform="rotate(288 50 52)"/>
  </g>
  <path fill="#f7f5f0" d="M50 10C70 10 80 25 78 47C76 68 66 87 50 91C34 87 24 68 22 47C20 25 30 10 50 10Z"/>
