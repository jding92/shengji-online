<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    Queen: a spread folding fan in seven blades with a plum blossom above.
    Black silhouette for CSS masking; suit color supplies the tint.
  -->
  <g fill="#000">
    <!-- Plum blossom (梅花). -->
    <circle cx="50" cy="14" r="4.6"/>
    <circle cx="43" cy="19" r="4.6"/>
    <circle cx="57" cy="19" r="4.6"/>
    <circle cx="45.5" cy="26" r="4.6"/>
    <circle cx="54.5" cy="26" r="4.6"/>
    <!-- Fan blades, pivot at (50,88). -->
    <path d="M50 88 L5.5 70.0 A48 48 0 0 1 12.2 58.4 Z"/>
    <path d="M50 88 L14.3 55.9 A48 48 0 0 1 24.6 47.3 Z"/>
    <path d="M50 88 L27.5 45.6 A48 48 0 0 1 40.0 41.1 Z"/>
    <path d="M50 88 L43.3 40.5 A48 48 0 0 1 56.7 40.5 Z"/>
    <path d="M50 88 L60.0 41.1 A48 48 0 0 1 72.5 45.6 Z"/>
    <path d="M50 88 L75.4 47.3 A48 48 0 0 1 85.7 55.9 Z"/>
    <path d="M50 88 L87.8 58.4 A48 48 0 0 1 94.5 70.0 Z"/>
    <!-- Pivot rivet. -->
    <circle cx="50" cy="88" r="5"/>
  </g>
</svg>
